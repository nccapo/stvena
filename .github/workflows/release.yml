name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          sh -n install.sh
          go vet ./...
          go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Test and package editor extension
        working-directory: extensions/vscode
        env:
          STVENA_SOURCE_REF: ${{ github.ref_name }}
        run: |
          npm ci
          npm test
          if [[ "$STVENA_SOURCE_REF" == *-* ]]; then
            npm run package -- --pre-release
          else
            npm run package
          fi
      - name: Release binaries and VSIX
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stable releases only; the tap tracks the latest non-prerelease.
      - name: Update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is unset; nccapo/homebrew-stvena will pick $TAG up on its own schedule."
            exit 0
          fi
          printf '{"event_type":"stvena-release","client_payload":{"version":"%s"}}' "$TAG" |
            gh api repos/nccapo/homebrew-stvena/dispatches --input -
